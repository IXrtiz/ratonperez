<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa del Ratón Pérez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, warm, for small kids and the grown-up holding the phone
   IDEA: a toy house front - the screen is the wall, the buttons are chunky toy keys
   PICTURE: the live 3D wall with the little door, the Ratón Pérez walking out
   COLOUR and TYPE: honey wall yellow, uniform blue, door red, brushing green; Fredoka rounded
   LAYOUT: title strip, big 3D stage, three large buttons; buttons stack on narrow phones */
:root{color-scheme:light dark;--bg:light-dark(#f6c945,#23305a);--ink:light-dark(#3b2106,#fff4d6);--panel:light-dark(#fff3cf,#18213f);
  --blue:#2f7fd8;--blue-d:#1c5aa3;--red:#d8452f;--red-d:#9e2d1c;--green:#2f9e5b;--green-d:#1e6e3e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif;overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px)}
h1{margin:0;font-size:clamp(22px,4.2vw,34px);line-height:1.05;font-weight:700;text-wrap:balance}
header p{margin:2px 0 0;font-size:15px;opacity:.85}
.grow{flex:1}
#voz{font:600 15px Fredoka,system-ui,sans-serif;border:0;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;
  background:var(--panel);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
#voz[aria-pressed=false]{opacity:.65}
#stage{position:relative;margin:0 max(2vw,8px);border-radius:22px;overflow:hidden;background:#f3d9a4;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bubble{position:absolute;left:0;top:0;max-width:min(78%,360px);padding:12px 18px;background:#fff;color:#2a1a08;border-radius:22px;
  font-size:clamp(17px,2.6vw,22px);font-weight:600;line-height:1.2;box-shadow:0 6px 18px rgba(60,30,0,.25);
  transform:translate(-50%,-100%) scale(.6);opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;text-align:center}
#bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
#loader{position:absolute;inset:0;display:grid;place-items:center;background:#f3d9a4;color:#5a3510;font-size:20px;font-weight:600;text-align:center;padding:20px}
#loader .bar{width:min(260px,70vw);height:14px;border-radius:9px;background:rgba(90,53,16,.15);margin:12px auto 0;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--red);border-radius:9px;transition:width .2s}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px max(2vw,8px) max(14px,env(safe-area-inset-bottom));max-width:980px;width:100%;margin:0 auto}
nav button{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:10px 14px;border:0;border-radius:20px;cursor:pointer;
  font:700 clamp(17px,2.3vw,21px)/1.1 Fredoka,system-ui,sans-serif;color:#fff;text-align:left;transition:transform .08s,box-shadow .08s,filter .2s}
nav button svg{width:38px;height:38px;flex:none}
nav button small{display:block;font-weight:500;font-size:13px;opacity:.9}
.b1{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}.b2{background:var(--red);box-shadow:0 6px 0 var(--red-d)}.b3{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
nav button:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
nav button:disabled{filter:saturate(.35) brightness(.95);cursor:default}
nav button.now{filter:none;outline:4px solid #fff;outline-offset:2px}
nav button:focus-visible,#voz:focus-visible{outline:4px solid #fff;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:600px){
  header p{display:none}
  nav{grid-template-columns:1fr;gap:9px}
  nav button{min-height:54px;justify-content:flex-start;padding-left:18px}
  nav button svg{width:32px;height:32px}
}
#arbtn{font:700 15px Fredoka,system-ui,sans-serif;border:0;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;
  background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
#arbtn[hidden]{display:none}
/* AR overlay (shown by Chrome on top of the camera image) */
#arui{display:none;position:fixed;inset:0;pointer-events:none;font-family:Fredoka,system-ui,sans-serif}
#arui.on{display:block}
#arui .top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:flex-start}
#arui .hint{flex:1;background:rgba(255,255,255,.92);color:#3b2106;border-radius:18px;padding:10px 14px;font-size:16px;font-weight:600;line-height:1.25}
#arui .top button{pointer-events:auto;border:0;border-radius:999px;min-height:44px;padding:8px 14px;font:700 15px Fredoka,system-ui,sans-serif;background:#fff;color:#3b2106;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#arui nav{position:absolute;left:0;right:0;bottom:0;pointer-events:auto;grid-template-columns:1fr;gap:9px;max-width:520px}
#arui nav button{min-height:54px;justify-content:flex-start;padding-left:18px}
#arui #bubble{position:fixed}
#arui{z-index:3}
#arui .hint[hidden]{display:none}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
body.camon #cam{display:block}
body.camon #stage{position:fixed;inset:0;margin:0;border-radius:0;z-index:2;background:#000;box-shadow:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <div class="grow">
    <h1>La casa del Ratón Pérez</h1>
    <p>Toca un botón y mira quién sale por la puertita.</p>
  </div>
  <button id="arbtn" type="button" hidden>Abrir cámara</button>
  <button id="voz" type="button" aria-pressed="true">Voz: sí</button>
</header>

<main id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="c" aria-label="La pared con la puertita del Ratón Pérez"></canvas>
  <div id="bubble" aria-hidden="true"></div>
  <div id="loader"><div>Abriendo la casita…<div class="bar"><i id="pbar"></i></div></div></div>
  <div class="sr" aria-live="polite" id="live"></div>
</main>

<nav>
  <button class="b1" id="btn-saludar" type="button" data-clip="Saludar" disabled>
    <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="#fff"><rect x="13" y="6" width="5" height="18" rx="2.5"/><rect x="19" y="4" width="5" height="20" rx="2.5"/><rect x="25" y="7" width="5" height="17" rx="2.5"/><rect x="8" y="15" width="5" height="13" rx="2.5" transform="rotate(-25 10 21)"/><rect x="11" y="18" width="20" height="16" rx="8"/></g><path d="M33 6c2 2 3 4 3 7M4 12c0-3 1-5 3-6" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
    <span>Saludar<small>Sale y te dice hola</small></span>
  </button>
  <button class="b2" id="btn-correo" type="button" data-clip="Recibir_Correo" disabled>
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="9" width="32" height="22" rx="4" fill="#fff"/><path d="M5 11l15 11 15-11" stroke="#d8452f" stroke-width="3" fill="none" stroke-linejoin="round"/><circle cx="31" cy="11" r="5" fill="#ffd93b"/></svg>
    <span>Recibir correo<small>Recibió tu carta</small></span>
  </button>
  <button class="b3" id="btn-cepillado" type="button" data-clip="Aprobar_Cepillado" disabled>
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="21" width="26" height="7" rx="3.5" fill="#fff" transform="rotate(-30 16 24)"/><g stroke="#bfe9ff" stroke-width="3" stroke-linecap="round"><path d="M25 8v8M29 6v8M33 4v8"/></g><path d="M22 30l3 3 6-7" stroke="#ffd93b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Aprobar cepillado<small>Muéstrale tus dientes</small></span>
  </button>
</nav>

<div id="arui">
  <div class="top">
    <div class="hint" id="arhint">Mueve el celular despacio apuntando al piso. Cuando aparezca el círculo, tócalo para poner la casita.</div>
    <button type="button" id="armove" hidden>Mover</button>
    <button type="button" id="arexit">Salir</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
{
  // Lines and timings (seconds from the start of each clip), matching the Blender animation.
  const EV = {
    Saludar: [{ t: 4.6, dur: 2.6, text: '¡Hola, amiguito! ¡Soy el Ratón Pérez!' }, { t: 7.4, dur: 1.6, text: '¡Qué gusto verte!' }],
    Recibir_Correo: [{ t: 4.9, dur: 2.2, text: '¡He recibido tu carta!' }, { t: 7.6, dur: 1.5, text: '¡Muchas gracias!' }],
    Aprobar_Cepillado: [
      { t: 4.6, dur: 3.0, text: '¡Hola! ¡Muéstrame cómo te cepillas los dientes!' },
      { t: 8.4, dur: 2.0, text: 'Mmm… a ver, a ver…' },
      { t: 11.5, dur: 2.8, text: '¡Muy bien! ¡Tu cepillado está aprobado!' },
      { t: 14.3, dur: 1.6, text: '¡Adiós! ¡Nos vemos pronto!' }]
  };

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('c');
  const bubble = document.getElementById('bubble');
  const live = document.getElementById('live');
  const buttons = [...document.querySelectorAll('nav button')];
  const vozBtn = document.getElementById('voz');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.xr.enabled = true;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf3d9a4);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.45;
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x7a5a3a, 0.8));
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.0);
  sun.position.set(-2.5, 4.5, 4.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -1, near: 0.5, far: 14 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);
  scene.add(sun.target);
  // everything that belongs to the little house lives in one group, so AR can move and shrink it
  const house = new THREE.Group();
  scene.add(house);
  const roomLight = new THREE.PointLight(0xffd9a0, 4, 0, 2);
  roomLight.position.set(0, 2.0, -1.3);
  house.add(roomLight);
  const backLight = new THREE.PointLight(0xfff0e0, 2.2, 0, 2);
  backLight.position.set(0, 1.4, -1.6);
  house.add(backLight);
  // soft shadow on the real floor in AR
  const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: 0.3 }));
  shadowCatcher.rotation.x = -Math.PI / 2;
  shadowCatcher.position.set(0, 0.003, 1.0);
  shadowCatcher.receiveShadow = true;
  shadowCatcher.visible = false;
  house.add(shadowCatcher);

  const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 60);
  const target = new THREE.Vector3(0, 0.8, -0.1);
  const controls = new OrbitControls(camera, canvas);
  controls.target.copy(target);
  Object.assign(controls, { enablePan: false, enableDamping: true, minAzimuthAngle: -0.7, maxAzimuthAngle: 0.7,
    minPolarAngle: 1.0, maxPolarAngle: 1.62, minDistance: 2.2, maxDistance: 9 });

  let camOn = false;
  function fit() {
    if (renderer.xr.isPresenting) return;
    const w = stage.clientWidth, h = stage.clientHeight;
    if (camOn) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      return;
    }
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const v = THREE.MathUtils.degToRad(camera.fov / 2);
    const hz = Math.atan(Math.tan(v) * camera.aspect);
    const d = Math.max(1.3 / Math.tan(v), 1.2 / Math.tan(hz), 3.0);
    camera.position.set(0, target.y + 0.16, target.z + d);
    camera.updateProjectionMatrix();
    controls.update();
  }
  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  fit();

  let mixer = null, clips = {}, current = null, busy = false, evs = [], evIdx = 0, head = null, bubbleUntil = -1, outsideFloor = null;
  const v3 = new THREE.Vector3();

  // ---------- voice
  const hasTTS = 'speechSynthesis' in window;
  let voice = null, voiceOn = hasTTS, unlocked = false;
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter(x => /^es/i.test(x.lang));
    voice = vs.find(x => /es[-_](MX|US|419)/i.test(x.lang)) || vs.find(x => /es[-_]ES/i.test(x.lang)) || vs[0] || null;
  }
  if (hasTTS) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
  else { vozBtn.textContent = 'Solo texto'; vozBtn.setAttribute('aria-pressed', 'false'); vozBtn.disabled = true; }
  vozBtn.addEventListener('click', () => {
    voiceOn = !voiceOn;
    vozBtn.setAttribute('aria-pressed', String(voiceOn));
    vozBtn.textContent = voiceOn ? 'Voz: sí' : 'Voz: no';
    if (!voiceOn && hasTTS) speechSynthesis.cancel();
  });
  function unlock() {
    if (!hasTTS || unlocked) return;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); unlocked = true; } catch (e) {}
  }
  function say(ev) {
    bubble.textContent = ev.text;
    bubble.classList.add('on');
    live.textContent = ev.text;
    bubbleUntil = ev.t + ev.dur + 0.7;
    if (!voiceOn || !hasTTS) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(ev.text);
      u.lang = voice ? voice.lang : 'es-ES';
      if (voice) u.voice = voice;
      u.pitch = 1.6; u.rate = 1.03; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function hideBubble() { bubble.classList.remove('on'); bubbleUntil = -1; }

  // ---------- buttons
  function setBusy(b, btn) {
    busy = b;
    buttons.forEach(x => { x.disabled = b; x.classList.toggle('now', b && x === btn); });
  }
  buttons.forEach(btn => btn.addEventListener('click', () => {
    if (busy || !mixer) return;
    const clip = clips[btn.dataset.clip];
    if (!clip) return;
    unlock();
    mixer.stopAllAction();
    current = mixer.clipAction(clip);
    current.reset();
    current.setLoop(THREE.LoopOnce, 1);
    current.clampWhenFinished = true;
    current.paused = false;
    current.play();
    evs = EV[btn.dataset.clip] || [];
    evIdx = 0;
    hideBubble();
    setBusy(true, btn);
  }));

  // ---------- load the house
  const loader = document.getElementById('loader');
  const pbar = document.getElementById('pbar');
  new GLTFLoader().load('raton_casa.json', gltf => {
    const root = gltf.scene;
    root.traverse(o => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
        if (o.isSkinnedMesh) o.frustumCulled = false;
      }
    });
    house.add(root);
    outsideFloor = root.getObjectByName('Piso_Afuera');
    head = root.getObjectByName('head');
    mixer = new THREE.AnimationMixer(root);
    gltf.animations.forEach(a => { clips[a.name] = a; });
    mixer.addEventListener('finished', () => { setBusy(false); hideBubble(); if (hasTTS) speechSynthesis.cancel(); });
    // start state: door closed, Ratón Pérez inside his house
    const idle = mixer.clipAction(clips.Saludar);
    idle.play();
    idle.paused = true;
    idle.time = 0;
    mixer.update(0);
    loader.remove();
    buttons.forEach(b => { b.disabled = false; });
    checkAR();
  }, e => {
    if (e.total) pbar.style.width = Math.round(100 * e.loaded / e.total) + '%';
  }, err => {
    loader.firstElementChild.textContent = 'No se pudo abrir la casita. Recarga la página.';
    console.error(err);
  });

  // ---------- "Abrir cámara": real AR (WebXR) when the phone supports it, otherwise camera + gyroscope
  const AR_SCALE = 0.35;                       // Ratón Pérez about 40 cm tall, door about 35 x 52 cm
  const arBtn = document.getElementById('arbtn');
  const arui = document.getElementById('arui');
  const arHint = document.getElementById('arhint');
  const arMove = document.getElementById('armove');
  const arExit = document.getElementById('arexit');
  const camVideo = document.getElementById('cam');
  const nav = document.querySelector('nav');
  const reticle = new THREE.Mesh(new THREE.RingGeometry(0.09, 0.12, 40).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);
  let arSession = null, hitSource = null, placed = false, xrSupported = false;
  let camStream = null, orient = null, alpha0 = null, camYaw = 0, camDist = 1.8;
  let noXR = false;
  try { noXR = localStorage.getItem('rp_noxr') === '1'; } catch (e) {}
  const tmpPos = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(), camPos = new THREE.Vector3();
  const CAM_H = 1.2;

  async function checkAR() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) arBtn.hidden = false;
    try {
      if (navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')) { xrSupported = true; arBtn.hidden = false; }
    } catch (e) {}
  }
  arui.addEventListener('beforexrselect', e => { if (e.target.closest('button')) e.preventDefault(); });

  function miniHouse(pos, rotY) {
    house.position.copy(pos);
    house.rotation.set(0, rotY, 0);
    house.scale.setScalar(AR_SCALE);
    roomLight.intensity = 4 * AR_SCALE * AR_SCALE;
    backLight.intensity = 2.2 * AR_SCALE * AR_SCALE;
    if (outsideFloor) outsideFloor.visible = false;
    shadowCatcher.visible = true;
    sun.position.copy(pos).add(new THREE.Vector3(-0.9, 1.6, 1.6));
    sun.target.position.copy(pos);
    Object.assign(sun.shadow.camera, { left: -1.4, right: 1.4, top: 1.4, bottom: -1.4, near: 0.1, far: 6 });
    sun.shadow.camera.updateProjectionMatrix();
  }
  function restoreHouse() {
    house.visible = true;
    house.position.set(0, 0, 0);
    house.rotation.set(0, 0, 0);
    house.scale.setScalar(1);
    roomLight.intensity = 4;
    backLight.intensity = 2.2;
    if (outsideFloor) outsideFloor.visible = true;
    shadowCatcher.visible = false;
    sun.position.set(-2.5, 4.5, 4.5);
    sun.target.position.set(0, 0, 0);
    Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -1, near: 0.5, far: 14 });
    sun.shadow.camera.updateProjectionMatrix();
    scene.background = new THREE.Color(0xf3d9a4);
    camera.fov = 38;
    controls.enabled = true;
  }
  function showOverlay() {
    arui.classList.add('on');
    arui.appendChild(nav);
    arui.appendChild(bubble);
    scene.background = null;
    controls.enabled = false;
  }
  function hideOverlay() {
    arui.classList.remove('on');
    document.body.insertBefore(nav, arui);
    stage.appendChild(bubble);
    nav.style.display = '';
    arHint.hidden = false;
  }
  function setPlaced(p) {
    placed = p;
    house.visible = p;
    arMove.hidden = !p;
    nav.style.display = p ? '' : 'none';
    arHint.textContent = p ? 'Toca un botón para que salga el Ratón Pérez.'
      : 'Mueve el celular despacio apuntando al piso. Cuando aparezca el círculo, tócalo para poner la casita.';
  }

  arBtn.addEventListener('click', async () => {
    if (arSession || camOn || !mixer) return;
    unlock();
    // iPhone asks for motion permission; it must be requested right inside the tap
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
    }
    if (xrSupported && !noXR) {
      try { await startAR(); return; }
      catch (e) {
        console.warn('WebXR AR no disponible, uso la cámara simple', e);
        noXR = true;
        try { localStorage.setItem('rp_noxr', '1'); } catch (_) {}
        if (arSession) { try { await arSession.end(); } catch (_) {} }
        arSession = null;
        hideOverlay();
        restoreHouse();
      }
    }
    await startCam();
  });

  async function startAR() {
    arSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: arui } });
    showOverlay();
    miniHouse(new THREE.Vector3(), 0);
    setPlaced(false);
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(arSession);
    const viewer = await arSession.requestReferenceSpace('viewer');
    hitSource = await arSession.requestHitTestSource({ space: viewer });
    arSession.addEventListener('select', () => {
      if (placed || !reticle.visible) return;
      reticle.matrix.decompose(tmpPos, tmpQ, tmpS);
      renderer.xr.getCamera().getWorldPosition(camPos);
      miniHouse(tmpPos, Math.atan2(camPos.x - tmpPos.x, camPos.z - tmpPos.z));
      reticle.visible = false;
      setPlaced(true);
    });
    arSession.addEventListener('end', endAR);
  }
  function endAR() {
    arSession = null;
    hitSource = null;
    reticle.visible = false;
    hideOverlay();
    restoreHouse();
    fit();
  }

  // ----- simple camera mode: phone camera behind, house in front, gyroscope keeps it in place
  async function startCam() {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) {
      alertBox('No se pudo abrir la cámara. Revisa que Chrome tenga permiso para usarla.');
      return;
    }
    camVideo.srcObject = camStream;
    try { await camVideo.play(); } catch (e) {}
    camOn = true;
    document.body.classList.add('camon');
    showOverlay();
    renderer.setClearColor(0x000000, 0);
    arMove.hidden = true;
    arHint.textContent = 'Apunta el celular hacia el piso: la casita está delante de ti. Desliza el dedo para moverla o acercarla.';
    setTimeout(() => { if (camOn) arHint.hidden = true; }, 7000);
    orient = null; alpha0 = null; camYaw = 0; camDist = 1.8;
    placeCamHouse();
    camera.fov = 55;
    camera.position.set(0, CAM_H, 0);
    window.addEventListener('deviceorientation', onOrient);
    fit();
  }
  function stopCam() {
    camOn = false;
    window.removeEventListener('deviceorientation', onOrient);
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    camVideo.srcObject = null;
    document.body.classList.remove('camon');
    hideOverlay();
    restoreHouse();
    fit();
  }
  function placeCamHouse() {
    miniHouse(new THREE.Vector3(-Math.sin(camYaw) * camDist, 0, -Math.cos(camYaw) * camDist), camYaw);
  }
  function onOrient(e) {
    if (e.alpha == null && e.beta == null) return;
    orient = e;
    if (alpha0 == null) alpha0 = e.alpha || 0;
  }
  // drag: left/right moves the house around you, up/down moves it farther/closer
  let drag = null;
  canvas.addEventListener('pointerdown', e => { if (camOn) drag = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('pointerup', () => { drag = null; });
  canvas.addEventListener('pointermove', e => {
    if (!camOn || !drag) return;
    camYaw -= (e.clientX - drag.x) * 0.005;
    camDist = Math.min(4, Math.max(0.9, camDist - (e.clientY - drag.y) * 0.008));
    drag = { x: e.clientX, y: e.clientY };
    placeCamHouse();
  });
  const zee = new THREE.Vector3(0, 0, 1), eul = new THREE.Euler(), qa = new THREE.Quaternion(),
    qBack = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  function camFromOrientation() {
    const d = THREE.MathUtils.degToRad;
    const so = d((screen.orientation && screen.orientation.angle) || window.orientation || 0);
    eul.set(d(orient.beta || 0), d((orient.alpha || 0) - alpha0), -d(orient.gamma || 0), 'YXZ');
    camera.quaternion.setFromEuler(eul);
    camera.quaternion.multiply(qBack);
    camera.quaternion.multiply(qa.setFromAxisAngle(zee, -so));
  }

  arMove.addEventListener('click', () => setPlaced(false));
  arExit.addEventListener('click', () => {
    if (arSession) arSession.end();
    else if (camOn) stopCam();
  });
  function alertBox(msg) {
    bubble.textContent = msg;
    bubble.classList.add('on');
    setTimeout(hideBubble, 4500);
  }

  // ---------- loop
  const clock = new THREE.Clock();
  renderer.setAnimationLoop((time, frame) => {
    const dt = Math.min(clock.getDelta(), 0.1);
    if (mixer) mixer.update(dt);
    if (camOn) {
      if (orient) camFromOrientation();
      else camera.lookAt(house.position.x, 0.18, house.position.z);
    } else if (!arSession) controls.update();
    if (frame && hitSource && !placed) {
      const hits = frame.getHitTestResults(hitSource);
      const ref = renderer.xr.getReferenceSpace();
      if (hits.length && ref) {
        const pose = hits[0].getPose(ref);
        reticle.visible = !!pose;
        if (pose) reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
    if (busy && current) {
      const t = current.time;
      while (evIdx < evs.length && t >= evs[evIdx].t) { say(evs[evIdx]); evIdx++; }
      if (bubbleUntil > 0 && t > bubbleUntil) hideBubble();
    }
    if (bubble.classList.contains('on') && head) {
      head.getWorldPosition(v3);
      v3.y += 0.62 * house.scale.y;
      v3.project(arSession ? renderer.xr.getCamera() : camera);
      const w = arSession ? window.innerWidth : stage.clientWidth, h = arSession ? window.innerHeight : stage.clientHeight;
      const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
      let x = (v3.x * 0.5 + 0.5) * w, y = (-v3.y * 0.5 + 0.5) * h;
      x = Math.min(Math.max(x, bw / 2 + 8), w - bw / 2 - 8);
      y = Math.min(Math.max(y, bh + 10), h - 10);
      bubble.style.left = x + 'px';
      bubble.style.top = y + 'px';
    }
    renderer.render(scene, camera);
  });
}
</script>
</body>
</html>
